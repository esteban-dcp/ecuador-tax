name: Publicar en npm

# Se dispara al subir una etiqueta vX.Y.Z (p. ej. `git tag v0.2.0 && git push --tags`).
# Publica los 7 paquetes con provenance. Autenticación: "trusted publishing" (OIDC) o, si se
# prefiere, un secreto NPM_TOKEN. Ver docs/publicar.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # necesario para OIDC (trusted publishing) y provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm # permite exigir una aprobación manual antes de publicar
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # npm >= 11.5.1 (requerido por trusted publishing)
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: La etiqueta coincide con la versión de los paquetes
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-release-version.mjs "$GITHUB_REF_NAME"
      - name: Publicar
        run: ./scripts/publish-workspace.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # vacío si usas trusted publishing
