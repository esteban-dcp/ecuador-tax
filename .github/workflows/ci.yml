name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24] # pnpm 11 exige Node >= 22.13 para ejecutarse
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm audit --prod --audit-level=critical
      # El SDK declara Node >= 20.3: comprobación de humo del build con Node 20.
      - name: Smoke test en Node 20
        if: matrix.node == 22
        run: |
          cat > /tmp/smoke.mjs <<'JS'
          import { validateIdentification } from '${{ github.workspace }}/packages/identification/dist/index.js';
          import { generateAccessKey } from '${{ github.workspace }}/packages/access-key/dist/index.js';
          import { buildFacturaXml } from '${{ github.workspace }}/packages/xml/dist/index.js';
          import { loadCredentialsFromP12, signXml, verifySignedXml } from '${{ github.workspace }}/packages/signature/dist/index.js';
          import { createTestP12, facturaBase } from '${{ github.workspace }}/packages/testing/dist/index.js';
          if (!validateIdentification('1710034065').ok) throw new Error('cedula');
          const { xml } = buildFacturaXml(facturaBase);
          const t = createTestP12();
          const firmado = signXml(xml, loadCredentialsFromP12(t.p12, t.password));
          if (!verifySignedXml(firmado).valid) throw new Error('firma');
          console.log('ok', process.version);
          JS
          npx -y node@20 /tmp/smoke.mjs
